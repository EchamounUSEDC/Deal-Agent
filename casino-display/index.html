<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casino Display — Falling Cards & Chips</title>
  <style>
    :root { --gold: #e9c46a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
    body { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #scene { position: fixed; inset: 0; display: block; }

    /* Casino marquee headline overlaid on the big screen */
    #headline {
      position: fixed;
      left: 0; right: 0; top: 6vh;
      text-align: center;
      pointer-events: none;
      z-index: 10;
      user-select: none;
    }
    #headline h1 {
      font-size: clamp(28px, 6vw, 96px);
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow:
        0 0 8px rgba(233,196,106,0.7),
        0 0 24px rgba(233,196,106,0.5),
        0 4px 18px rgba(0,0,0,0.8);
      animation: glow 3s ease-in-out infinite alternate;
    }
    #headline p {
      margin-top: 0.4em;
      font-size: clamp(14px, 2vw, 30px);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #f5e6c8;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      opacity: 0.9;
    }
    @keyframes glow {
      from { filter: brightness(1); }
      to   { filter: brightness(1.25); }
    }

    /* Small control hint — auto-hides */
    #hint {
      position: fixed; bottom: 14px; right: 18px; z-index: 10;
      color: rgba(255,255,255,0.45); font-size: 13px; letter-spacing: 0.05em;
      transition: opacity 1s ease; pointer-events: none;
    }
    #hint.hide { opacity: 0; }

    #loading {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 18px; z-index: 20; background: #0a0a0f;
      color: var(--gold); letter-spacing: 0.3em; text-transform: uppercase; font-size: 14px;
      transition: opacity 0.8s ease;
    }
    #loading .spinner {
      width: 46px; height: 46px; border: 3px solid rgba(233,196,106,0.2);
      border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading.done { opacity: 0; pointer-events: none; }
  </style>

  <!-- Three.js + cannon-es loaded as ES modules from CDN -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
</head>
<body>
  <div id="loading"><div class="spinner"></div><div>Dealing&hellip;</div></div>

  <div id="headline">
    <h1 data-title>Lucky Star Casino</h1>
    <p data-subtitle>Where Fortune Falls</p>
  </div>

  <div id="hint">Press <b>F</b> for fullscreen &nbsp;&middot;&nbsp; <b>Space</b> to deal &nbsp;&middot;&nbsp; <b>H</b> hide text</div>

  <canvas id="scene"></canvas>

  <script type="module" src="./main.js"></script>
</body>
</html>
