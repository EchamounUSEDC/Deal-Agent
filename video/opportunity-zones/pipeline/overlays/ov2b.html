<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Inter;src:url(../assets/fonts/inter-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:Inter;src:url(../assets/fonts/inter-latin-500-normal.woff2) format('woff2');font-weight:500}
@font-face{font-family:Inter;src:url(../assets/fonts/inter-latin-600-normal.woff2) format('woff2');font-weight:600}
@font-face{font-family:Inter;src:url(../assets/fonts/inter-latin-700-normal.woff2) format('woff2');font-weight:700}
@font-face{font-family:Inter;src:url(../assets/fonts/inter-latin-800-normal.woff2) format('woff2');font-weight:800}
@font-face{font-family:Mono;src:url(../assets/fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:Mono;src:url(../assets/fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2');font-weight:500}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
#scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,9,16,.38) 0%,transparent 24%,transparent 46%,rgba(3,7,13,.85) 100%);opacity:0}
#loc{position:absolute;top:64px;left:96px;display:flex;align-items:center;gap:14px;opacity:0}
#loc .tick{width:34px;height:2px;background:#C9A64B}
#loc span{font-family:Mono;font-size:17px;letter-spacing:.32em;color:#C7D4E4;text-shadow:0 1px 8px rgba(0,0,0,.6)}
#hdr{position:absolute;left:96px;bottom:332px;opacity:0}
#hdr h1{font-size:44px;font-weight:800;color:#F2F6FB;text-shadow:0 2px 16px rgba(0,0,0,.6)}
#stats{position:absolute;left:96px;right:96px;bottom:110px;display:flex;gap:26px}
.st{flex:1;background:rgba(7,14,24,.72);border:1px solid rgba(150,180,220,.20);border-top:3px solid #C9A64B;border-radius:10px;padding:30px 34px;opacity:0;backdrop-filter:blur(6px)}
.st .n{font-size:58px;font-weight:800;color:#F2F6FB;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.st .l{font-family:Mono;font-size:14.5px;letter-spacing:.2em;color:#9DB0C6;margin-top:10px}
</style>
</head>
<body>
<div id="scrim"></div>
<div id="loc"><div class="tick"></div><span>PECOS, TEXAS &nbsp;·&nbsp; PERMIAN BASIN OPERATIONS</span></div>
<div id="hdr"><h1>A Direct Energy Investment Platform</h1></div>
<div id="stats">
 <div class="st" id="s1"><div class="n" id="n1">45+</div><div class="l">YEARS OF EXPERIENCE</div></div>
 <div class="st" id="s2"><div class="n" id="n2">4,000+</div><div class="l">WELLS PARTICIPATED</div></div>
 <div class="st" id="s3"><div class="n" id="n3">13</div><div class="l">STATES + CANADA</div></div>
 <div class="st" id="s4"><div class="n" id="n4">$4B+</div><div class="l">CAPITAL DEPLOYED</div></div>
</div>
<script>
window.__ready=false;
const clamp01=x=>x<0?0:x>1?1:x;
const span=(t,a,b)=>clamp01((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const lerp=(a,b,x)=>a+(b-a)*x;
const el=i=>document.getElementById(i);
const fmt=n=>n.toLocaleString('en-US');
window.seek=function(t){
  el('scrim').style.opacity=eo(span(t,.1,.8));
  const lIn=eo(span(t,.4,1.2));el('loc').style.opacity=lIn;el('loc').style.transform=`translateY(${lerp(12,0,lIn)}px)`;
  const hIn=eo(span(t,.8,1.7));el('hdr').style.opacity=hIn;el('hdr').style.transform=`translateY(${lerp(20,0,hIn)}px)`;
  const T0=[1.3,1.75,2.2,2.65];
  ['s1','s2','s3','s4'].forEach((id,i)=>{
    const a=eo(span(t,T0[i],T0[i]+.75));
    const s=el(id);s.style.opacity=a;s.style.transform=`translateY(${lerp(34,0,a)}px)`;
  });
  el('n1').textContent=Math.round(lerp(0,45,eo(span(t,T0[0],T0[0]+1.3))))+'+';
  el('n2').textContent=fmt(Math.round(lerp(0,4000,eo(span(t,T0[1],T0[1]+1.5))))) + '+';
  el('n3').textContent=Math.round(lerp(0,13,eo(span(t,T0[2],T0[2]+1.2))));
  el('n4').textContent='$'+Math.round(lerp(0,4,eo(span(t,T0[3],T0[3]+1.2))))+'B+';
};
window.seek(0);
window.__ready=true;
</script>
</body>
</html>
