<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Inter;src:url(../assets/fonts/inter-latin-500-normal.woff2) format('woff2');font-weight:500}
@font-face{font-family:Inter;src:url(../assets/fonts/inter-latin-700-normal.woff2) format('woff2');font-weight:700}
@font-face{font-family:Inter;src:url(../assets/fonts/inter-latin-800-normal.woff2) format('woff2');font-weight:800}
@font-face{font-family:Mono;src:url(../assets/fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2');font-weight:400}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
#scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,9,16,.35) 0%,transparent 25%,transparent 52%,rgba(3,7,13,.8) 100%);opacity:0}
.kick{position:absolute;top:64px;left:96px;display:flex;align-items:center;gap:14px;opacity:0}
.kick .tick{width:34px;height:2px;background:#C9A64B}
.kick span{font-family:Mono;font-size:17px;letter-spacing:.32em;color:#C7D4E4;text-shadow:0 1px 8px rgba(0,0,0,.6)}
#line{position:absolute;left:96px;bottom:190px;font-size:47px;font-weight:800;color:#F2F6FB;text-shadow:0 2px 18px rgba(0,0,0,.6);opacity:0}
#chips{position:absolute;left:96px;bottom:110px;display:flex;gap:18px}
.chip{padding:14px 26px;border:1px solid rgba(201,166,75,.55);border-radius:100px;background:rgba(7,14,24,.62);font-size:21px;font-weight:700;color:#EAD9A8;letter-spacing:.04em;opacity:0;backdrop-filter:blur(6px)}
</style>
</head>
<body>
<div id="scrim"></div>
<div class="kick" id="kick"><div class="tick"></div><span>WHY OPPORTUNITY ZONES</span></div>
<div id="line">A strategy built for the long term</div>
<div id="chips">
 <div class="chip" id="p1">Long-Term Investing</div>
 <div class="chip" id="p2">Community Development</div>
 <div class="chip" id="p3">Tax Planning</div>
</div>
<script>
window.__ready=false;
const clamp01=x=>x<0?0:x>1?1:x;
const span=(t,a,b)=>clamp01((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const lerp=(a,b,x)=>a+(b-a)*x;
const el=i=>document.getElementById(i);
window.seek=function(t){
  el('scrim').style.opacity=eo(span(t,.1,.9));
  const k=eo(span(t,.4,1.2));el('kick').style.opacity=k;
  const l=eo(span(t,.9,1.8));el('line').style.opacity=l;el('line').style.transform=`translateY(${lerp(24,0,l)}px)`;
  [['p1',1.6],['p2',2.2],['p3',2.8]].forEach(([id,t0])=>{
    const a=eo(span(t,t0,t0+.7));
    const c=el(id);c.style.opacity=a;c.style.transform=`translateY(${lerp(24,0,a)}px)`;
  });
};
window.seek(0);
window.__ready=true;
</script>
</body>
</html>
