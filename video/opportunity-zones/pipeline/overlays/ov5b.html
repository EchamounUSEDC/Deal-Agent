<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Inter;src:url(../assets/fonts/inter-latin-500-normal.woff2) format('woff2');font-weight:500}
@font-face{font-family:Inter;src:url(../assets/fonts/inter-latin-700-normal.woff2) format('woff2');font-weight:700}
@font-face{font-family:Inter;src:url(../assets/fonts/inter-latin-800-normal.woff2) format('woff2');font-weight:800}
@font-face{font-family:Mono;src:url(../assets/fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2');font-weight:400}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
#scrim{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(3,7,13,.8) 100%);opacity:0}
#lt{position:absolute;left:96px;bottom:120px}
#lt .bar{width:5px;background:#C9A64B;position:absolute;left:0;top:6px;bottom:6px;transform-origin:bottom;border-radius:2px}
#lt .tx{padding-left:34px}
#lt h1{font-size:47px;font-weight:800;color:#F2F6FB;text-shadow:0 2px 18px rgba(0,0,0,.6);opacity:0}
#lt h2{font-size:24px;font-weight:500;color:#C2CFDF;margin-top:10px;letter-spacing:.05em;text-shadow:0 1px 12px rgba(0,0,0,.65);opacity:0}
</style>
</head>
<body>
<div id="scrim"></div>
<div id="lt">
 <div class="bar" id="bar"></div>
 <div class="tx">
  <h1 id="t1">Decades of operational experience</h1>
  <h2 id="t2">Disciplined energy investments, managed with institutional rigor</h2>
 </div>
</div>
<script>
window.__ready=false;
const clamp01=x=>x<0?0:x>1?1:x;
const span=(t,a,b)=>clamp01((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const lerp=(a,b,x)=>a+(b-a)*x;
const el=i=>document.getElementById(i);
window.seek=function(t){
  el('scrim').style.opacity=eo(span(t,.1,.8));
  el('bar').style.transform=`scaleY(${eo(span(t,.5,1.3))})`;
  const a1=eo(span(t,.7,1.6));el('t1').style.opacity=a1;el('t1').style.transform=`translateY(${lerp(24,0,a1)}px)`;
  const a2=eo(span(t,1.05,1.95));el('t2').style.opacity=a2;el('t2').style.transform=`translateY(${lerp(20,0,a2)}px)`;
};
window.seek(0);
window.__ready=true;
</script>
</body>
</html>
